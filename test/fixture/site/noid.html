<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture Site — no ids</title>
<!--
  The page `sections`' escape hatch exists for: `main`'s children are sections, and
  none of them can be named by a selector of its own.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.4 system-ui, sans-serif; color: #eef1f6; background: #0a0c10; }
  main > section { height: 2000px; padding: 40px 32px; }
  /* A line the page never paints — the sort a template bolts onto a heading. What
     this proves is exactly the `display: none` case: `textContent` hands the line
     back and the reel would carry copy no viewer ever saw, and `innerText` reads
     what is laid out, so it does not. It is not the whole of "hidden": the canonical
     clipped sr-only pattern (1px, `clip: rect(0 0 0 0)`) *is* laid out, and
     `innerText` returns it — a heading written that way still reaches the reel, and
     the fix for one is a `label` rather than a smarter reader. */
  .sr-only { display: none; }
</style>
</head>
<body>
<main>
  <!-- Set in two by a `<br>`, which is one line of copy when it is read aloud. -->
  <section><h2>First<br>section<span class="sr-only"> — jump to the first section</span></h2></section>
  <!-- Over a label's 28-character budget, and only reachable through `main` — so a
       beat that takes it has to be windowed by its own y and height to find it. -->
  <section><h2>Enrolling now for the autumn term</h2></section>
</main>
</body>
</html>
